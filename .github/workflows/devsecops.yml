name: DevSecOps Build & Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-and-audit:
    name: SAST & Dependency Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Python Dependency Security Audit
      - name: Audit Backend Dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      # 2. Python Static Application Security Testing (Bandit)
      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r backend/ -x backend/analyzer/tests.py -ll

      # 3. Node Security Audit
      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  container-security:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [ sast-and-audit, k8s-lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        env:
          DOCKER_BUILDKIT: 0
        run: |
          docker build -t cv-analyzer-backend:${{ github.sha }} ./backend

      # 4. Scan Container Image with Trivy
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cv-analyzer-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  k8s-lint:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -output text k8s/